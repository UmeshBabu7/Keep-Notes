{% extends 'base.html' %}

{% block body %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 mb-0">My Notes</h1>
        <button class="btn btn-primary" onclick="openModal('add-modal')">
            <i class="fas fa-plus me-2"></i>Add Note
        </button>
    </div>

    <div class="row g-4">
        {% for note in notes %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm hover-shadow">
                <div class="card-body">
                    <h5 class="card-title text-primary mb-3">{{note.title}}</h5>
                    <p class="card-text text-muted">{{note.description}}</p>
                </div>
                <div class="card-footer bg-transparent border-0 d-flex justify-content-end gap-2">
                    <a href="{% url 'notes:update' note.id %}" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-edit me-1"></i>Edit
                    </a>
                    <a href="{% url 'notes:delete' note.id %}" class="btn btn-outline-danger btn-sm">
                        <i class="fas fa-trash-alt me-1"></i>Delete
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="text-center py-5">
                <i class="fas fa-sticky-note fa-3x text-muted mb-3"></i>
                <h3 class="h4 text-muted">No Notes Yet</h3>
                <p class="text-muted">Click the "Add Note" button to create your first note!</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Add Note Modal -->
<div class="modal fade" id="add-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0">
                <h5 class="modal-title">
                    <i class="fas fa-plus-circle me-2 text-primary"></i>Add New Note
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form action="" method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" name="title" id="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea name="description" id="description" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Save Note
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .hover-shadow {
        transition: all 0.3s ease;
    }
    .hover-shadow:hover {
        transform: translateY(-5px);
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
    }
</style>

<script>
    function openModal(modalId) {
        var myModal = new bootstrap.Modal(document.getElementById(modalId));
        myModal.show();
    }
</script>
{% endblock body %}
